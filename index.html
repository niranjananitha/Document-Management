<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWS AI - Document Intelligence Dashboard</title>
    
    <!-- Google Fonts: Work Sans for System, Livvic for Brand Requirements -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&amp;family=Livvic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS CDN with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "surface-container": "#ecedf7",
              "outline": "#727784",
              "primary-fixed-dim": "#acc7ff",
              "secondary-fixed": "#d6e3fc",
              "on-error": "#ffffff",
              "error": "#ba1a1a",
              "tertiary": "#934100",
              "inverse-surface": "#2e3037",
              "on-tertiary": "#ffffff",
              "background": "#f8faff",
              "surface-bright": "#f9f9ff",
              "tertiary-fixed-dim": "#ffb68d",
              "surface-container-lowest": "#ffffff",
              "on-secondary-fixed-variant": "#3b475b",
              "primary-container": "#1e6fd9",
              "on-secondary-container": "#58657a",
              "secondary-fixed-dim": "#bac7df",
              "surface-container-low": "#f2f3fc",
              "surface-variant": "#e1e2eb",
              "on-tertiary-fixed-variant": "#763300",
              "on-error-container": "#93000a",
              "surface-dim": "#d8d9e3",
              "tertiary-container": "#b95400",
              "surface-container-highest": "#e1e2eb",
              "outline-variant": "#c2c6d5",
              "on-tertiary-container": "#fff6f2",
              "on-secondary-fixed": "#0f1c2e",
              "inverse-primary": "#acc7ff",
              "on-primary-fixed-variant": "#004591",
              "on-primary-container": "#f7f7ff",
              "on-primary-fixed": "#001a40",
              "secondary": "#525f74",
              "tertiary-fixed": "#ffdbc9",
              "on-primary": "#ffffff",
              "on-tertiary-fixed": "#331200",
              "surface-tint": "#005cbd",
              "on-background": "#0f1c2e",
              "error-container": "#ffdad6",
              "secondary-container": "#d6e3fc",
              "on-surface": "#0f1c2e",
              "inverse-on-surface": "#eff0fa",
              "surface-container-high": "#e6e8f1",
              "on-surface-variant": "#424753",
              "primary-fixed": "#d7e2ff",
              "on-secondary": "#ffffff",
              "primary": "#1e6fd9",
              "surface": "#ffffff"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "stack-sm": "8px",
              "margin": "32px",
              "stack-md": "16px",
              "base": "8px",
              "stack-lg": "32px",
              "gutter": "24px"
            },
            "fontFamily": {
              "headline-md": ["Work Sans"],
              "label-md": ["Work Sans"],
              "body-md": ["Work Sans"],
              "body-lg": ["Work Sans"],
              "headline-lg": ["Work Sans"],
              "headline-sm": ["Work Sans"],
              "livvic": ["Livvic", "sans-serif"]
            },
            "fontSize": {
              "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
              "label-md": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
              "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
              "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
              "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
              "headline-sm": ["20px", {"lineHeight": "1.4", "fontWeight": "500"}]
            },
            "boxShadow": {
              "brand": "0 2px 12px rgba(30,111,217,0.08)",
              "brand-hover": "0 4px 20px rgba(30,111,217,0.12)"
            }
          },
        },
      }
    </script>
    <style>
      body { font-family: 'Work Sans', sans-serif; -webkit-font-smoothing: antialiased; }
      .livvic-font { font-family: 'Livvic', sans-serif; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .shadow-brand { box-shadow: 0 2px 12px rgba(30,111,217,0.08); }
      .shadow-brand-hover:hover { box-shadow: 0 4px 20px rgba(30,111,217,0.12); }
      
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .animate-spin-slow { animation: spin 3s linear infinite; }
    </style>
  </head>
  <body class="bg-background text-on-surface min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
